<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sus Tavern</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=26">
<link rel="stylesheet" href="css/style.css?v=26">
</head>
<body>
  <div id="r3d-wrap"></div>
  <div id="cine-top" class="cine-bar"></div><div id="cine-bot" class="cine-bar"></div>
  <div id="bg" aria-hidden="true"></div><div id="dim" aria-hidden="true"></div><div id="vignette" aria-hidden="true"></div>

  <section id="screen-loading" class="screen active"><div class="loading-spinner"></div></section>

  <section id="screen-lobby" class="screen">
    <div class="lobby-card poly">
      <select class="lang-select lobby-lang" aria-label="Language"></select>
      <div class="lobby-logo" id="lobby-logo"></div>
      <h1 class="lobby-title" id="lobby-title"></h1>
      <p class="lobby-sub muted" id="lobby-sub"></p>
      <label for="input-name" id="lbl-name"></label>
      <input type="text" id="input-name" maxlength="16" autocomplete="off">
      <div class="resume-card" id="resume-card" style="display:none"><div class="resume-text"><b id="resume-title"></b><p class="muted" id="resume-body"></p></div><button type="button" class="btn" id="btn-resume"></button></div>
      <div class="tabs">
        <button type="button" class="tab-btn" data-tab="create" id="tab-btn-create"></button>
        <button type="button" class="tab-btn" data-tab="join" id="tab-btn-join"></button>
        <button type="button" class="tab-btn active" data-tab="offline" id="tab-btn-offline"></button>
      </div>
      <div class="tab-panel" id="tab-create"><button type="button" class="btn btn-block" id="btn-create-room"></button></div>
      <div class="tab-panel" id="tab-join"><label for="input-room-code" id="lbl-code"></label><input type="text" id="input-room-code" maxlength="5" autocomplete="off" style="text-transform:uppercase"><button type="button" class="btn btn-block" id="btn-join-room"></button></div>
      <div class="tab-panel active" id="tab-offline"><p class="muted small" id="offline-hint"></p><div id="off-chars"></div><div id="off-rules"></div><button type="button" class="btn btn-block" id="btn-start-offline"></button></div>
      <p class="muted small center" id="online-off-note" style="display:none"></p>
    </div>
  </section>

  <section id="screen-waiting" class="screen">
    <div class="waiting-card poly">
      <div class="room-code-box" id="room-code-box"><div class="label" id="room-code-label"></div><div class="code" id="room-code-display">-----</div></div>
      <h3 id="seats-title"></h3><div id="seat-grid" class="seat-grid"></div>
      <div id="wait-chars"></div><button type="button" class="btn btn-secondary btn-block" id="btn-add-bot"></button>
      <div class="rules-box"><h3 id="rules-title"></h3><div id="rules-list"></div><p id="rules-readonly-hint" class="muted small"></p></div>
      <button type="button" class="btn btn-block" id="btn-start-game"></button>
      <p id="waiting-hint" class="muted center"></p>
      <button type="button" class="btn btn-secondary btn-block" id="btn-leave-waiting"></button>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <div class="game-header">
      <h2><span id="game-title"></span> <span class="room-chip" id="game-room-code-label"></span> <span class="room-chip" id="round-chip"></span> <span class="room-chip" id="sg-chip" style="display:none"></span></h2>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="btn-rules"></button><button type="button" class="icon-btn" id="btn-3d"></button>
        <button type="button" class="icon-btn" id="btn-music"></button><button type="button" class="icon-btn" id="btn-sound"></button>
        <select class="lang-select" aria-label="Language"></select><button type="button" class="icon-btn" id="btn-leave-game"></button>
      </div>
    </div>
    <div class="game-body">
      <div class="arena">
        <div class="table2d" id="table2d">
          <div class="felt"></div>
          <div class="center-pile" id="center"></div>
          <div id="seats"></div>
        </div>
        <div class="cam-bar" id="cam-bar"></div>
        <div class="statusline" id="status"></div>
        <div class="hand2d" id="hand"></div>
        <div class="actions" id="actions">
          <button type="button" class="btn btn-alt btn-play" id="btn-play"></button>
          <button type="button" class="btn btn-liar" id="btn-liar"></button>
          <button type="button" class="btn btn-pull" id="btn-pull"></button>
        </div>
        <div class="emote-bar" id="emote-bar"></div>
      </div>
      <div class="side-panel"><div class="log-wrap"><div id="log-panel"></div></div></div>
    </div>
  </section>

  <div id="gunpanel" class="gunpanel"></div><div id="modal"></div><div id="toast"></div><div id="fx"></div><div id="flash-screen"></div><div class="banner" id="banner"></div>

  <script type="importmap">{"imports":{"three":"./js/lib/three.module.min.js"}}</script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=26"></script>
  <script src="js/i18n.js?v=26"></script>
  <script src="js/sus-sound.js?v=26"></script>
  <script src="js/sus-art.js?v=26"></script>
  <script src="js/sus-fx.js?v=26"></script>
  <script src="js/sus-engine.js?v=26"></script>
  <script src="js/sus-net.js?v=26"></script>
  <script type="module" src="js/sus-3d.js?v=26" onerror="window.S3D_ERR='load'"></script>
  <script src="js/sus-ui.js?v=26"></script>
</body>
</html>
